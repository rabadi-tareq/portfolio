name: Build Data and Deploy Jekyll

on:
  push:
    branches:
      - main  # Runs every time you push code to your main branch
  schedule:
    - cron: '0 0 * * *'  # Runs automatically every single day at midnight UTC
  workflow_dispatch:  # Gives you a manual "Run" button on GitHub.com

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Python Dependencies
      run: pip install requests

    - name: Run Script to Update Repo Data
      run: python update_repos.py

    - name: Commit Updated Data Back to Repo
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update of GitHub project timestamps [skip ci]" && git push)

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Build Jekyll Site
      uses: actions/jekyll-build-pages@v1
      with:
        source: ./
        destination: ./_site

    - name: Upload Build Artifact
      uses: actions/upload-pages-artifact@v3

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
